  services:
    postgres:
      image: postgres:15
      container_name: postgres
      ports:
        - 5432:5432
      environment:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: password
        POSTGRES_DB: mydatabase
      networks:
        - postgres
      volumes:
        - data:/var/lib/postgresql/data

    pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin
      ports:
        - 8081:80
      environment:
        PGADMIN_DEFAULT_EMAIL: root@example.com
        PGADMIN_DEFAULT_PASSWORD: secret
      volumes:
        - pgadmin-data:/var/lib/pgadmin
      depends_on:
        - postgres
      restart: always
      networks:
        - postgres

    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend
      ports:
        - 5000:5000
      env_file:
        - ./backend/.env
      environment:
        - PORT=5000
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_USER=root
        - DB_PASSWORD=password
        - DB_NAME=mydatabase
        - FRONTEND_URL=http://localhost:8080
        # any additional env vars (Clerk etc) can live in .env
      volumes:
        - ./backend:/usr/src/app
      depends_on:
        - postgres
      restart: always
      networks:
        - postgres

  volumes:
    data:
    pgadmin-data:

  networks:
    postgres:
      name: postgres